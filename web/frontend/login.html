<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - __SMARTTEST_WEB_BRAND__</title>
    <link rel="stylesheet" href="/src/smarttest-theme.css">

</head>
<body class="login-screen">
    <header class="login-brand">__SMARTTEST_WEB_BRAND__</header>
    <!-- Theme Toggle (Fixed Position) -->
    <div class="login-theme-toggle">
        <div class="role-segments" role="group" aria-label="Appearance">
            <button type="button" class="theme-btn theme-btn-light active" onclick="setTheme('light')" aria-label="Light theme"><span data-icon="sun"></span></button>
            <button type="button" class="theme-btn theme-btn-dark" onclick="setTheme('dark')" aria-label="Dark theme"><span data-icon="moon"></span></button>
        </div>
    </div>

    <!-- Login Page -->
    <main class="login-page" data-login-board data-motion="vivid">
        <section class="login-container" aria-labelledby="login-title">
            <div class="card login-card">
                <div class="login-header">
                    <h1 id="login-title" class="login-title">Welcome back</h1>
                    <p class="login-subtitle">Sign in to your account to continue</p>
                </div>

                <form class="login-form" data-login-form>
                    <div class="form-group">
                        <label class="form-label" for="account-name">Account name</label>
                        <input id="account-name" name="username" type="text" class="form-control" autocomplete="username" placeholder="Enter your account name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="account-password">Password</label>
                        <input id="account-password" name="password" type="password" class="form-control" autocomplete="current-password" placeholder="Enter your password" required>
                    </div>

                    <div class="inline-status" data-auth-status aria-live="polite"></div>
                    <button type="submit" class="button button-primary login-sign-in">Sign in</button>
                </form>
                <footer class="login-footer">&copy; 2026 __SMARTTEST_WEB_BRAND__</footer>
            </div>
        </section>
    </main>

    <script src="/smarttest-portal.js"></script><script type="module" src="/src/login-main.js"></script>
</body>
</html>
